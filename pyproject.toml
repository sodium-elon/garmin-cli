[project]
name = "garmin-cli"
version = "0.1.0"
description = "CLI for Garmin Connect — inner-loop companion to garmin-mcp (Python, garminconnect)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "garminconnect>=0.3.11",
]

[project.scripts]
garmin-cli = "garmin_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_cli"]
