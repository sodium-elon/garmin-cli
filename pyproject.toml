[project]
name = "garmin-cli"
version = "0.1.0"
description = "Read-only Garmin Personal API CLI with original FIT staging"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fitdecode>=0.11,<0.12",
]

[project.scripts]
garmin-cli = "garmin_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_cli"]
